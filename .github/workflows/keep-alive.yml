name: Keep Render backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS -o /dev/null -w "health %{http_code}\n"             https://ai-customer-support-backend-ldbf.onrender.com/health || echo "health ping failed"
