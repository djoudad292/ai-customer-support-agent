name: Android APK (direct)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ai-customer-support-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish APK to GitHub Release
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk ai-customer-support.apk
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-apk
          name: Latest AI Customer Support APK
          body: |
            Latest Android APK built from main.
          files: ai-customer-support.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
