name: Netlify Deploy

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'netlify.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps and build static export
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://ai-customer-support-backend-ldbf.onrender.com
        run: |
          npm ci
          npm run build

      - name: Deploy to Netlify
        run: npx --yes netlify-cli@27.1.0 deploy --prod --dir frontend/out --site 1dff2b0d-844e-4678-b1b5-61b8d6921b34
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
